<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tabata計時" />
  <meta name="theme-color" content="#0f172a" />
  <title>Tabata 間歇計時器</title>
  <style>
    :root {
      --bg-setup: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --phase-prep: #d97706;
      --phase-work: #dc2626;
      --phase-rest: #059669;
      --phase-done: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-setup);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.35s ease;
      overflow-x: hidden;
    }

    /* 階段動態背景色 */
    body.state-prep { background-color: var(--phase-prep); }
    body.state-work { background-color: var(--phase-work); }
    body.state-rest { background-color: var(--phase-rest); }
    body.state-done { background-color: var(--phase-done); }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 頂部列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .offline-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      display: none;
    }

    .offline-badge.ready {
      display: inline-block;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active { transform: scale(0.94); }

    /* 設定畫面 */
    #setup-view {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .setup-col-left,
    .setup-col-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .preset-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 10px 6px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .preset-btn span {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 400;
    }

    .preset-btn:active { background: #334155; }

    .setting-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-info label {
      display: block;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .setting-info small {
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.35rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-btn:active { background: rgba(255, 255, 255, 0.25); }

    .step-val {
      font-size: 1.3rem;
      font-weight: 700;
      min-width: 54px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* 動作清單卡片 */
    .exercises-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .exercises-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercises-header span {
      font-size: 0.98rem;
      font-weight: 600;
    }

    .clear-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .clear-btn:active {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .exercise-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .round-tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .exercise-input {
      flex: 1;
      background: var(--card-inner);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .exercise-input:focus {
      border-color: var(--accent);
    }

    .exercise-input::placeholder {
      color: #64748b;
    }

    .summary-bar {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 4px 0;
    }

    .summary-bar strong {
      color: var(--accent);
      font-size: 1.1rem;
    }

    /* 計時畫面 */
    #timer-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      text-align: center;
      padding: 6px 0;
    }

    .timer-left {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    .round-badge {
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 22px;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .current-exercise-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
    }

    .current-exercise-title {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      word-break: break-word;
    }

    .ring-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }

    .ring-wrapper svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 10;
    }

    .ring-progress {
      fill: none;
      stroke: #ffffff;
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear;
    }

    .timer-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .phase-label {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .time-digits {
      font-size: 5.2rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }

    .next-hint {
      background: rgba(0, 0, 0, 0.18);
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 底部按鈕區 */
    .controls {
      width: 100%;
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    .primary-btn {
      flex: 2;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: #ffffff;
      color: #0f172a;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .primary-btn:active { transform: scale(0.98); }

    .secondary-btn {
      flex: 1;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.2);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-btn:active { background: rgba(0, 0, 0, 0.35); }

    /* iPad 與寬螢幕（橫放 / 平板模式）雙欄適應 */
    @media (min-width: 740px) {
      .container {
        max-width: 1060px;
        padding: 20px 32px;
      }

      #setup-view {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: stretch;
      }

      .setup-col-left {
        justify-content: space-between;
      }

      .setup-col-right {
        justify-content: space-between;
      }

      .exercises-card {
        flex: 1;
      }

      .exercise-list {
        max-height: 290px;
      }

      #timer-view {
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        gap: 36px;
        padding: 12px 16px;
      }

      .timer-left {
        flex: 1;
      }

      .ring-wrapper {
        width: 340px;
        height: 340px;
        margin: 0;
      }

      .phase-label {
        font-size: 1.75rem;
      }

      .time-digits {
        font-size: 6.8rem;
      }

      .timer-right {
        flex: 1.15;
        align-items: flex-start;
        text-align: left;
        gap: 20px;
      }

      .current-exercise-box {
        align-items: flex-start;
        padding: 0;
      }

      .current-exercise-title {
        font-size: 2.8rem;
      }

      .next-hint {
        width: 100%;
        justify-content: flex-start;
        font-size: 1.2rem;
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>⏱️ TABATA 計時器</h1>
        <span class="offline-badge" id="offline-badge">可離線使用</span>
      </div>
      <button id="sound-toggle" class="icon-btn" title="音效開關">🔊</button>
    </header>

    <!-- 設定畫面 -->
    <main id="setup-view">
      <div class="setup-col-left">
        <div class="presets">
          <button type="button" class="preset-btn" id="preset-tabata">
            經典 Tabata<span>20s 動 / 10s 休 × 8</span>
          </button>
          <button type="button" class="preset-btn" id="preset-hiit">
            高強度 HIIT<span>40s 動 / 20s 休 × 6</span>
          </button>
          <button type="button" class="preset-btn" id="preset-circuit">
            循環訓練<span>30s 動 / 15s 休 × 6</span>
          </button>
        </div>

        <div class="setting-card">
          <div class="setting-info">
            <label>預備暖身</label>
            <small>開始前的緩衝倒數</small>
          </div>
          <div class="stepper">
            <button type="button" class="step-btn" data-key="prep" data-delta="-5">−</button>
            <div class="step-val" id="val-prep">5s</div>
            <button type="button" class="step-btn" data-key="prep" data-delta="5">+</button>
          </div>
        </div>

        <div class="setting-card">
          <div class="setting-info">
            <label>運動時間</label>
            <small>全力訓練秒數</small>
          </div>
          <div class="stepper">
            <button type="button" class="step-btn" data-key="work" data-delta="-5">−</button>
            <div class="step-val" id="val-work">20s</div>
            <button type="button" class="step-btn" data-key="work" data-delta="5">+</button>
          </div>
        </div>

        <div class="setting-card">
          <div class="setting-info">
            <label>休息時間</label>
            <small>組間喘息秒數</small>
          </div>
          <div class="stepper">
            <button type="button" class="step-btn" data-key="rest" data-delta="-5">−</button>
            <div class="step-val" id="val-rest">10s</div>
            <button type="button" class="step-btn" data-key="rest" data-delta="5">+</button>
          </div>
        </div>

        <div class="setting-card">
          <div class="setting-info">
            <label>訓練回合</label>
            <small>總共重複組數</small>
          </div>
          <div class="stepper">
            <button type="button" class="step-btn" data-key="rounds" data-delta="-1">−</button>
            <div class="step-val" id="val-rounds">8</div>
            <button type="button" class="step-btn" data-key="rounds" data-delta="1">+</button>
          </div>
        </div>
      </div>

      <div class="setup-col-right">
        <div class="exercises-card">
          <div class="exercises-header">
            <span>各回合動作名稱（選填）</span>
            <button type="button" class="clear-btn" id="clear-exercises-btn">一鍵清空</button>
          </div>
          <div class="exercise-list" id="exercise-list"></div>
        </div>

        <div>
          <div class="summary-bar">
            總訓練時長：<strong id="total-time">03:55</strong>
          </div>
          <div class="controls">
            <button type="button" class="primary-btn" id="start-btn">開始訓練</button>
          </div>
        </div>
      </div>
    </main>

    <!-- 計時畫面 -->
    <main id="timer-view">
      <div class="timer-left">
        <div class="ring-wrapper">
          <svg viewBox="0 0 280 280">
            <circle class="ring-bg" cx="140" cy="140" r="126"></circle>
            <circle class="ring-progress" id="ring-bar" cx="140" cy="140" r="126"></circle>
          </svg>
          <div class="timer-center">
            <div class="phase-label" id="phase-text">預備</div>
            <div class="time-digits" id="time-display">5</div>
          </div>
        </div>
      </div>

      <div class="timer-right">
        <div class="round-badge" id="round-display">回合 1 / 8</div>

        <div class="current-exercise-box">
          <div class="current-exercise-title" id="current-exercise">準備開始</div>
        </div>

        <div class="next-hint" id="next-hint">接下來：第 1 組訓練（20 秒）</div>

        <div class="controls">
          <button type="button" class="secondary-btn" id="stop-btn">結束</button>
          <button type="button" class="primary-btn" id="pause-btn">暫停</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const config = {
      prep: 5,
      work: 20,
      rest: 10,
      rounds: 8,
      exercises: Array(8).fill('')
    };

    let soundEnabled = true;
    let audioCtx = null;
    let wakeLock = null;

    let timerId = null;
    let isPaused = false;
    let currentPhase = 'prep';
    let currentRound = 1;
    let phaseDuration = 5;
    let remainingMs = 5000;
    let lastTick = 0;
    let lastProcessedSecond = null;
    let lastBeatSlot = null;

    const radius = 126;
    const circumference = 2 * Math.PI * radius;
    let ringBar = null;

    function ensureExerciseArrayLength() {
      while (config.exercises.length < config.rounds) {
        config.exercises.push('');
      }
      if (config.exercises.length > config.rounds) {
        config.exercises = config.exercises.slice(0, config.rounds);
      }
    }

    function getExerciseName(roundIndex) {
      const name = (config.exercises[roundIndex - 1] || '').trim();
      return name || `第 ${roundIndex} 組訓練`;
    }

    function loadSavedConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem('tabata_cfg_v8'));
        if (saved && typeof saved === 'object') {
          if (typeof saved.prep === 'number') config.prep = saved.prep;
          if (typeof saved.work === 'number') config.work = saved.work;
          if (typeof saved.rest === 'number') config.rest = saved.rest;
          if (typeof saved.rounds === 'number') config.rounds = saved.rounds;
          if (Array.isArray(saved.exercises)) config.exercises = saved.exercises;
        }
      } catch (e) {}
      ensureExerciseArrayLength();
      renderSetup();
    }

    function saveConfig() {
      try {
        localStorage.setItem('tabata_cfg_v8', JSON.stringify(config));
      } catch (e) {}
    }

    function adjust(key, delta) {
      if (key === 'rounds') {
        config.rounds = Math.min(50, Math.max(1, config.rounds + delta));
        ensureExerciseArrayLength();
      } else if (key === 'prep' || key === 'rest') {
        config[key] = Math.min(300, Math.max(0, config[key] + delta));
      } else {
        config[key] = Math.min(600, Math.max(5, config[key] + delta));
      }
      saveConfig();
      renderSetup();
    }

    function applyPreset(prep, work, rest, rounds) {
      config.prep = prep;
      config.work = work;
      config.rest = rest;
      config.rounds = rounds;
      config.exercises = Array(rounds).fill('');
      saveConfig();
      renderSetup();
    }

    function clearExercises() {
      config.exercises = Array(config.rounds).fill('');
      saveConfig();
      renderExerciseInputs();
    }

    function updateExerciseName(idx, value) {
      config.exercises[idx] = value;
      saveConfig();
    }

    function renderExerciseInputs() {
      const listEl = document.getElementById('exercise-list');
      if (!listEl) return;
      listEl.innerHTML = '';
      for (let i = 0; i < config.rounds; i++) {
        const row = document.createElement('div');
        row.className = 'exercise-row';

        const tag = document.createElement('div');
        tag.className = 'round-tag';
        tag.textContent = `#${i + 1}`;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'exercise-input';
        input.placeholder = `第 ${i + 1} 組動作名稱`;
        input.value = config.exercises[i] || '';
        input.addEventListener('input', (e) => updateExerciseName(i, e.target.value));

        row.appendChild(tag);
        row.appendChild(input);
        listEl.appendChild(row);
      }
    }

    function renderSetup() {
      document.getElementById('val-prep').textContent = `${config.prep}s`;
      document.getElementById('val-work').textContent = `${config.work}s`;
      document.getElementById('val-rest').textContent = `${config.rest}s`;
      document.getElementById('val-rounds').textContent = config.rounds;

      const totalSec = config.prep + (config.work * config.rounds) + (config.rest * Math.max(0, config.rounds - 1));
      const mins = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      document.getElementById('total-time').textContent = `${mins}:${secs}`;

      renderExerciseInputs();
    }

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    function playTone(freq, duration, type = 'sine', delay = 0, volume = 0.35) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    // 電影計時炸彈電子蜂鳴器 Beep（沉穩不刺耳的中高頻脈衝 + 低八度厚度）
    function playBombBeep(level = 1) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        // level 1: 前段倒數 / level 2: 最後 5 秒
        const freq = level === 2 ? 1480 : 1250;
        const dur = level === 2 ? 0.075 : 0.09;
        const vol = level === 2 ? 0.32 : 0.28;

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, now);

        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(freq * 0.5, now);

        gain.gain.setValueAtTime(vol, now);
        gain.gain.setValueAtTime(vol * 0.9, now + dur * 0.7);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + dur);
        osc2.stop(now + dur);
      } catch (e) {}
    }

    // 炸彈引爆衝擊音效（重低音震波 + 白噪音爆破）
    function playBombExplosion() {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;

        const subOsc = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(160, now);
        subOsc.frequency.exponentialRampToValueAtTime(28, now + 0.55);

        subGain.gain.setValueAtTime(0.55, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        subOsc.connect(subGain);
        subGain.connect(audioCtx.destination);
        subOsc.start(now);
        subOsc.stop(now + 0.6);

        const bufferSize = Math.floor(audioCtx.sampleRate * 0.65);
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(140, now + 0.6);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.5, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        noise.start(now);
        noise.stop(now + 0.65);
      } catch (e) {}
    }

    function playCue(type) {
      if (type === 'bomb-1') playBombBeep(1);
      if (type === 'bomb-2') playBombBeep(2);
      if (type === 'boom') playBombExplosion();

      // 預備與休息階段最後 3 秒提示音
      if (type === 'countdown-warn') playTone(660, 0.14, 'sine', 0, 0.4);

      // 開始運動：明亮清脆的上揚雙音和弦（C6 -> E6 + 高音泛音）
      if (type === 'work') {
        playTone(1046.5, 0.14, 'triangle', 0, 0.45);
        playTone(1318.5, 0.34, 'triangle', 0.09, 0.5);
        playTone(2093.0, 0.28, 'sine', 0.09, 0.22);
      }

      // 進入休息：柔和下降提示音
      if (type === 'rest') {
        playTone(587.33, 0.16, 'sine', 0.12, 0.32);
        playTone(440.0, 0.32, 'sine', 0.22, 0.35);
      }

      // 全部完成：勝利三連音
      if (type === 'done') {
        playTone(523.25, 0.16, 'triangle', 0.18, 0.4);
        playTone(659.25, 0.16, 'triangle', 0.33, 0.4);
        playTone(1046.5, 0.48, 'triangle', 0.48, 0.48);
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function releaseWakeLock() {
      try {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
      } catch (e) {}
    }

    function startWorkout() {
      initAudio();
      requestWakeLock();
      document.getElementById('setup-view').style.display = 'none';
      document.getElementById('timer-view').style.display = 'flex';
      isPaused = false;
      document.getElementById('pause-btn').textContent = '暫停';
      currentRound = 1;

      if (config.prep > 0) {
        enterPhase('prep', config.prep);
      } else {
        enterPhase('work', config.work);
        playCue('work');
      }

      lastTick = performance.now();
      timerId = requestAnimationFrame(loop);
    }

    function enterPhase(phase, seconds) {
      currentPhase = phase;
      phaseDuration = seconds;
      remainingMs = seconds * 1000;
      lastProcessedSecond = seconds;
      lastBeatSlot = null;

      document.body.className = `state-${phase}`;
      document.getElementById('round-display').textContent = `回合 ${currentRound} / ${config.rounds}`;

      const phaseLabels = {
        prep: '預備',
        work: '運動！',
        rest: '休息',
        done: '完成！'
      };
      document.getElementById('phase-text').textContent = phaseLabels[phase];

      const currentExEl = document.getElementById('current-exercise');
      const nextHintEl = document.getElementById('next-hint');

      if (phase === 'prep') {
        currentExEl.textContent = '調整呼吸，準備開始';
        nextHintEl.textContent = `第一個動作：${getExerciseName(1)}（${config.work} 秒）`;
      } else if (phase === 'work') {
        currentExEl.textContent = getExerciseName(currentRound);
        if (currentRound < config.rounds) {
          const nextAction = getExerciseName(currentRound + 1);
          nextHintEl.textContent = config.rest > 0
            ? `接下來：休息 ${config.rest} 秒 → ${nextAction}`
            : `下一個動作：${nextAction}`;
        } else {
          nextHintEl.textContent = '最後一回合，撐住！';
        }
      } else if (phase === 'rest') {
        currentExEl.textContent = '組間休息';
        nextHintEl.textContent = `下一個動作：${getExerciseName(currentRound + 1)}（${config.work} 秒）`;
      } else {
        currentExEl.textContent = '訓練完成！';
        nextHintEl.textContent = `共完成 ${config.rounds} 回合訓練`;
      }

      updateDisplay();
    }

    function loop(now) {
      if (!isPaused && currentPhase !== 'done') {
        const dt = now - lastTick;
        remainingMs -= dt;

        const secLeft = Math.ceil(remainingMs / 1000);

        if (currentPhase === 'work' && remainingMs > 0) {
          // 兩段式計時炸彈倒數：
          // 最後 5 秒：每 500ms 雙響 / 前段倒數：每 1000ms 單響
          if (remainingMs <= 5000) {
            const slot = `h-${Math.ceil(remainingMs / 500)}`;
            if (slot !== lastBeatSlot) {
              lastBeatSlot = slot;
              playCue('bomb-2');
            }
          } else {
            const slot = `s-${secLeft}`;
            if (slot !== lastBeatSlot && secLeft < phaseDuration) {
              lastBeatSlot = slot;
              playCue('bomb-1');
            }
          }
        } else if ((currentPhase === 'rest' || currentPhase === 'prep') && secLeft >= 1 && secLeft !== lastProcessedSecond) {
          lastProcessedSecond = secLeft;
          if (secLeft <= 3) {
            playCue('countdown-warn');
          }
        }

        if (remainingMs <= 0) {
          advancePhase();
        } else {
          updateDisplay();
        }
      }
      lastTick = now;
      if (currentPhase !== 'done') {
        timerId = requestAnimationFrame(loop);
      }
    }

    function advancePhase() {
      if (currentPhase === 'prep') {
        enterPhase('work', config.work);
        playCue('work');
      } else if (currentPhase === 'work') {
        playCue('boom');
        if (currentRound < config.rounds) {
          if (config.rest > 0) {
            enterPhase('rest', config.rest);
            playCue('rest');
          } else {
            currentRound++;
            enterPhase('work', config.work);
            playCue('work');
          }
        } else {
          enterPhase('done', 0);
          playCue('done');
          releaseWakeLock();
          document.getElementById('pause-btn').style.display = 'none';
        }
      } else if (currentPhase === 'rest') {
        currentRound++;
        enterPhase('work', config.work);
        playCue('work');
      }
    }

    function updateDisplay() {
      const secLeft = Math.max(0, Math.ceil(remainingMs / 1000));
      document.getElementById('time-display').textContent = currentPhase === 'done' ? '✓' : secLeft;

      if (ringBar) {
        const ratio = phaseDuration > 0 ? Math.max(0, remainingMs / (phaseDuration * 1000)) : 1;
        const offset = circumference * (1 - ratio);
        ringBar.style.strokeDashoffset = offset;
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      document.getElementById('pause-btn').textContent = isPaused ? '繼續' : '暫停';
      if (!isPaused) {
        initAudio();
        lastTick = performance.now();
      }
    }

    function stopWorkout() {
      cancelAnimationFrame(timerId);
      releaseWakeLock();
      document.body.className = '';
      document.getElementById('timer-view').style.display = 'none';
      document.getElementById('setup-view').style.display = '';
      document.getElementById('pause-btn').style.display = 'block';
    }

    function registerOfflineSupport() {
      try {
        const badge = document.getElementById('offline-badge');
        if ('caches' in window && location.protocol && location.protocol.startsWith('http')) {
          caches.open('tabata-offline-v2').then((cache) => {
            const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            const response = new Response(htmlContent, {
              headers: { 'Content-Type': 'text/html; charset=utf-8' }
            });
            return cache.put(location.href, response);
          }).then(() => {
            if (badge) badge.classList.add('ready');
          }).catch(() => {});
        }
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      ringBar = document.getElementById('ring-bar');
      if (ringBar) {
        ringBar.style.strokeDasharray = `${circumference} ${circumference}`;
      }

      document.getElementById('sound-toggle').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) {
          initAudio();
          playBombBeep(2);
        }
      });

      document.getElementById('preset-tabata').addEventListener('click', () => applyPreset(5, 20, 10, 8));
      document.getElementById('preset-hiit').addEventListener('click', () => applyPreset(5, 40, 20, 6));
      document.getElementById('preset-circuit').addEventListener('click', () => applyPreset(5, 30, 15, 6));

      document.querySelectorAll('.step-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-key');
          const delta = parseInt(btn.getAttribute('data-delta'), 10);
          adjust(key, delta);
        });
      });

      document.getElementById('clear-exercises-btn').addEventListener('click', clearExercises);
      document.getElementById('start-btn').addEventListener('click', startWorkout);
      document.getElementById('stop-btn').addEventListener('click', stopWorkout);
      document.getElementById('pause-btn').addEventListener('click', togglePause);

      loadSavedConfig();
      registerOfflineSupport();
    });
  </script>
</body>
</html>
