<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tabata計時" />
  <meta name="theme-color" content="#0f172a" />
  <title>Tabata 間歇計時器</title>
  <script>
    // 動態產生內嵌 PWA Manifest 與專屬圖示（維持單一檔案結構）
    (function setupPWA() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0f172a"/><circle cx="256" cy="272" r="156" fill="none" stroke="#38bdf8" stroke-width="28"/><path d="M256 180v92l64 40" fill="none" stroke="#f8fafc" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="64" width="80" height="24" rx="12" fill="#38bdf8"/></svg>`;
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);

      if (location.protocol.startsWith('http')) {
        const manifest = {
          name: 'Tabata 間歇計時器',
          short_name: 'Tabata計時',
          start_url: location.href,
          display: 'standalone',
          background_color: '#0f172a',
          theme_color: '#0f172a',
          icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
        };
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.appendChild(manifestLink);
      }
    })();
  </script>
  <style>
    :root {
      --bg-setup: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --phase-prep: #d97706;
      --phase-work: #dc2626;
      --phase-rest: #059669;
      --phase-done: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-setup);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.35s ease;
      overflow-x: hidden;
    }

    /* 階段動態背景色 */
    body.state-prep { background-color: var(--phase-prep); }
    body.state-work { background-color: var(--phase-work); }
    body.state-rest { background-color: var(--phase-rest); }
    body.state-done { background-color: var(--phase-done); }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* 頂部列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .offline-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      display: none;
    }

    .offline-badge.ready {
      display: inline-block;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active { transform: scale(0.94); }

    /* 設定畫面 */
    #setup-view {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .setup-col-left,
    .setup-col-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .preset-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 10px 6px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .preset-btn span {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 400;
    }

    .preset-btn:active { background: #334155; }

    .setting-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-info label {
      display: block;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .setting-info small {
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.35rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-btn:active { background: rgba(255, 255, 255, 0.25); }

    .step-val {
      font-size: 1.3rem;
      font-weight: 700;
      min-width: 54px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* 動作清單卡片 */
    .exercises-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .exercises-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercises-header span {
      font-size: 0.98rem;
      font-weight: 600;
    }

    .clear-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .clear-btn:active {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .exercise-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .round-tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .exercise-input {
      flex: 1;
      background: var(--card-inner);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .exercise-input:focus {
      border-color: var(--accent);
    }

    .exercise-input::placeholder {
      color: #64748b;
    }

    .summary-bar {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 4px 0;
    }

    .summary-bar strong {
      color: var(--accent);
      font-size: 1.1rem;
    }

    /* 計時畫面 */
    #timer-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      text-align: center;
      padding: 6px 0;
    }

    .timer-left {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    .round-badge {
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 22px;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .current-exercise-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
    }

    .current-exercise-title {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      word-break: break-word;
    }

    .ring-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }

    .ring-wrapper svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 10;
    }

    .ring-progress {
      fill: none;
      stroke: #ffffff;
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear;
    }

    .timer-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .phase-label {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .time-digits {
      font-size: 5.2rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }

    .next-hint {
      background: rgba(0, 0, 0, 0.18);
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 底部按鈕區 */
    .controls {
      width: 100%;
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    .primary-btn {
      flex: 2;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: #ffffff;
      color: #0f172a;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .primary-btn:active { transform: scale(0.98); }

    .secondary-btn {
      flex: 1;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.2);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-btn:active { background: rgba(0, 0, 0, 0.35); }

    /* iPad 與寬螢幕（橫放 / 平板模式）雙欄適應 */
    @media (min-width: 740px) {
      .container {
        max-width: 1060px;
        padding: 20px 32px;
      }

      #setup-view {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: stretch;
      }

      .setup-col-left {
        justify-content: space-between;
      }

      .setup-col-right {
        justify-content: space-between;
      }

      .exercises-card {
        flex: 1;
      }

      .exercise-list {
        max-height: 290px;
      }

      #timer-view {
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        gap: 36px;
        padding: 12px 16px;
      }

      .timer-left {
        flex: 1;
      }

      .ring-wrapper {
        width: 340px;
        height: 340px;
        margin: 0;
      }

      .phase-label {
        font-size: 1.75rem;
      }

      .time-digits {
        font-size: 6.8rem;
      }

      .timer-right {
        flex: 1.15;
        align-items: flex-start;
        text-align: left;
        gap: 20px;
      }

      .current-exercise-box {
        align-items: flex-start;
        padding: 0;
      }

      .current-exercise-title {
        font-size: 2.8rem;
      }

      .next-hint {
        width: 100%;
        justify-content: flex-start;
        font-size: 1.2rem;
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>⏱️ TABATA 計時器</h1>
        <span class="offline-badge" id="offline-badge">可離線使用</span>
      </div>
      <button id="sound-toggle" class="icon-btn" title="音效開關">🔊</button>
    </header>
    <main id="setup-view">
      <div class="setup-col-left">
        <div class="presets" id="presets"></div>
        <div id="settings" class="setup-col-left"></div>
      </div>
      <div class="setup-col-right">
        <section class="exercises-card">
          <div class="exercises-header"><span>動作清單</span><button class="clear-btn" id="clear">清空</button></div>
          <div class="exercise-list" id="exercises"></div>
        </section>
        <p class="summary-bar">預計總時間 <strong id="total"></strong></p>
        <div class="controls"><button class="primary-btn" id="start">開始訓練</button></div>
      </div>
    </main>
    <main id="timer-view">
      <div class="timer-left"><div class="ring-wrapper">
        <svg viewBox="0 0 260 260" aria-hidden="true">
          <circle class="ring-bg" cx="130" cy="130" r="118"/>
          <circle class="ring-progress" id="ring" cx="130" cy="130" r="118" pathLength="100" stroke-dasharray="100"/>
        </svg>
        <div class="timer-center">
          <p class="phase-label" id="phase" aria-live="polite"></p>
          <p class="time-digits" id="time" role="timer"></p>
        </div>
      </div></div>
      <div class="timer-right">
        <p class="round-badge" id="round"></p>
        <div class="current-exercise-box"><p class="current-exercise-title" id="exercise"></p></div>
        <p class="next-hint" id="next"></p>
        <div class="controls">
          <button class="secondary-btn" id="stop">返回設定</button>
          <button class="primary-btn" id="pause">暫停</button>
        </div>
      </div>
    </main>
  </div>
  <style>
    #settings { justify-content: flex-start; }
    .exercise-input { min-width: 0; }
    .ring-wrapper { max-width: 100%; }
    .time-digits { font-size: clamp(3.3rem, 8vw, 5.2rem); }
    #pause[hidden] { display: none; }
    button:focus-visible, input:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
  </style>
  <script>
    const el = id => document.getElementById(id);
    const config = [
      { label: '準備時間', unit: '秒', min: 0, max: 60 },
      { label: '訓練時間', unit: '秒', min: 1, max: 300 },
      { label: '休息時間', unit: '秒', min: 0, max: 300 },
      { label: '訓練輪數', unit: '輪', min: 1, max: 30 }
    ];
    const presets = [
      { name: '經典Tabata', values: [10, 20, 10, 8] },
      { name: '高強度HIIT', values: [5, 40, 20, 6] },
      { name: '循環訓練', values: [10, 30, 15, 6] }
    ];
    let settings = [...presets[0].values];
    const exercises = [];
    const values = [];
    let stages = [];
    let stage = 0;
    let deadline = 0;
    let remaining = 0;
    let paused = false;
    let frame;
    let sound = true;
    let audio;
    let audioOutput;
    let lastSecond;
    const soundVolume = 0.30;

    function format(seconds) {
      return [Math.floor(seconds / 60), seconds % 60]
        .map(value => String(value).padStart(2, '0')).join(':');
    }

    function renderExercises() {
      const inputs = Array.from({ length: settings[3] }, (_, index) => {
        const row = document.createElement('div');
        row.className = 'exercise-row';
        const badge = document.createElement('span');
        badge.className = 'round-tag';
        badge.textContent = index + 1;
        const input = document.createElement('input');
        input.className = 'exercise-input';
        input.placeholder = '例如：深蹲';
        input.setAttribute('aria-label', '第 ' + (index + 1) + ' 輪動作');
        input.value = exercises[index] || '';
        input.maxLength = 60;
        input.addEventListener('input', () => { exercises[index] = input.value; });
        row.append(badge, input);
        return row;
      });
      el('exercises').replaceChildren(...inputs);
    }

    function renderSettings() {
      config.forEach(({ unit, min, max }, index) => {
        const { value, minus, plus } = values[index];
        value.textContent = settings[index] + ' ' + unit;
        minus.disabled = settings[index] === min;
        plus.disabled = settings[index] === max;
      });
      const [prep, work, rest, rounds] = settings;
      el('total').textContent = format(prep + work * rounds + rest * (rounds - 1));
      if (el('exercises').children.length !== rounds) renderExercises();
    }

    config.forEach(({ label }, index) => {
      const card = document.createElement('div');
      card.className = 'setting-card';
      card.innerHTML = '<span class="setting-info"></span><div class="stepper"><button class="step-btn">−</button><span class="step-val"></span><button class="step-btn">+</button></div>';
      card.firstElementChild.textContent = label;
      const [minus, value, plus] = card.lastElementChild.children;
      values.push({ minus, value, plus });
      [[minus, -1, '減少'], [plus, 1, '增加']].forEach(([button, delta, action]) => {
        button.setAttribute('aria-label', action + label);
        button.onclick = () => {
          settings[index] += delta;
          renderSettings();
        };
      });
      el('settings').append(card);
    });

    presets.forEach(({ name, values: preset }) => {
      const button = document.createElement('button');
      button.className = 'preset-btn';
      button.textContent = name;
      const caption = document.createElement('span');
      caption.textContent = preset[1] + '秒訓練 / ' + preset[2] + '秒休息' + ' ×' + preset[3];
      button.append(caption);
      button.onclick = () => {
        settings = [...preset];
        renderSettings();
      };
      el('presets').append(button);
    });

    function unlockAudio() {
      if (!sound) return;
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      try {
        if (!audio) {
          audio = new Audio();
          audioOutput = audio.createGain();
          audioOutput.gain.value = paused ? 0 : soundVolume;
          audioOutput.connect(audio.destination);
        }
        return audio.resume().catch(() => {});
      } catch {
        audio = undefined;
        audioOutput = undefined;
      }
    }

    function beep(frequency, duration = 0.22, level = 1, type = 'sine') {
      if (!sound || paused || audio?.state !== 'running') return;
      const wave = audio.createOscillator();
      const volume = audio.createGain();
      const start = audio.currentTime;
      wave.type = type;
      wave.frequency.value = frequency;
      volume.gain.setValueAtTime(level, start);
      volume.gain.exponentialRampToValueAtTime(0.001, start + duration);
      wave.connect(volume).connect(audioOutput);
      wave.start(start);
      wave.stop(start + duration);
    }

    function renderStage() {
      const current = stages[stage];
      const next = stages[stage + 1];
      const labels = { prep: '準備', work: '訓練', rest: '休息', done: '完成' };
      const name = round => exercises[round - 1]?.trim() || '第 ' + round + ' 輪訓練';
      document.body.className = 'state-' + (current?.type || 'done');
      el('phase').textContent = labels[current?.type || 'done'];
      el('round').textContent = '第 ' + (current?.round || settings[3]) + ' / ' + settings[3] + ' 輪';
      el('exercise').textContent = current ? name(current.type === 'rest' ? current.round + 1 : current.round) : '訓練完成';
      el('next').textContent = current
        ? next ? '接下來 ' + labels[next.type] + (next.type === 'work' ? ' · ' + name(next.round) : '') : '接下來 完成'
        : '已完成 ' + settings[3] + ' 輪';
      el('pause').hidden = !current;
    }

    function paintTime(milliseconds, duration) {
      el('time').textContent = format(Math.ceil(milliseconds / 1000));
      el('ring').style.strokeDashoffset = duration ? 100 * (1 - milliseconds / duration) : 100;
    }

    function tick() {
      const now = performance.now();
      const previous = stage;
      while (stage < stages.length && now >= deadline) {
        stage++;
        if (stages[stage]) deadline += stages[stage].duration;
      }
      if (stage !== previous) {
        renderStage();
        lastSecond = undefined;
      }
      const current = stages[stage];
      if (!current) {
        beep(880);
        paintTime(0, 0);
        el('stop').focus();
        return;
      }
      remaining = Math.max(0, deadline - now);
      const seconds = Math.ceil(remaining / 1000);
      if (seconds !== lastSecond) {
        lastSecond = seconds;
        if (current.type === 'work') {
          const elapsedSeconds = current.duration / 1000 - seconds;
          if (stage !== previous) beep(1040);
          else if (elapsedSeconds > 0) {
            beep(elapsedSeconds % 2 ? 620 : 440, 0.08, 0.66, 'triangle');
          }
        } else if (current.type === 'rest') {
          if (seconds <= 3) beep(740, 0.14);
          else if (stage !== previous) beep(520);
        }
      }
      paintTime(remaining, current.duration);
      frame = requestAnimationFrame(tick);
    }

    el('start').onclick = () => {
      const audioReady = unlockAudio();
      const [prep, work, rest, rounds] = settings;
      stages = [];
      if (prep) stages.push({ type: 'prep', duration: prep * 1000, round: 1 });
      for (let round = 1; round <= rounds; round++) {
        stages.push({ type: 'work', duration: work * 1000, round });
        if (rest && round < rounds) stages.push({ type: 'rest', duration: rest * 1000, round });
      }
      stage = 0;
      paused = false;
      if (audioOutput) audioOutput.gain.value = sound ? soundVolume : 0;
      lastSecond = undefined;
      const first = stages[0];
      deadline = performance.now() + first.duration;
      el('setup-view').style.display = 'none';
      el('timer-view').style.display = 'flex';
      el('pause').textContent = '暫停';
      renderStage();
      el('pause').focus();
      tick();
      if (first.type === 'work') {
        audioReady?.then(() => {
          if (stages[stage] === first && lastSecond === first.duration / 1000 && frame !== undefined) {
            beep(1040);
          }
        });
      }
    };

    el('pause').onclick = () => {
      if (paused) {
        unlockAudio();
        deadline = performance.now() + remaining;
        paused = false;
        if (audioOutput) audioOutput.gain.value = sound ? soundVolume : 0;
        el('pause').textContent = '暫停';
        tick();
        return;
      }
      cancelAnimationFrame(frame);
      if (audioOutput) audioOutput.gain.value = 0;
      remaining = Math.max(0, deadline - performance.now());
      paused = true;
      paintTime(remaining, stages[stage].duration);
      el('pause').textContent = '繼續';
      el('phase').textContent = '已暫停';
    };
    el('pause').addEventListener('click', () => {
      if (!paused && stages[stage]) renderStage();
    });

    el('stop').onclick = () => {
      cancelAnimationFrame(frame);
      frame = undefined;
      if (audioOutput) audioOutput.gain.value = 0;
      document.body.className = '';
      el('timer-view').style.display = 'none';
      el('setup-view').style.removeProperty('display');
      el('start').focus();
    };

    el('clear').onclick = () => {
      exercises.length = 0;
      renderExercises();
    };

    el('sound-toggle').setAttribute('aria-pressed', 'true');
    el('sound-toggle').onclick = () => {
      sound = !sound;
      el('sound-toggle').textContent = sound ? '🔊' : '🔇';
      el('sound-toggle').setAttribute('aria-pressed', String(sound));
      if (audioOutput) audioOutput.gain.value = sound && !paused ? soundVolume : 0;
      unlockAudio();
    };
    if (location.protocol === 'file:') el('offline-badge').classList.add('ready');
    renderSettings();
  </script>
</body>
</html>
